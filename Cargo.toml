[package]
name = "box"
version = "0.3.0"
edition = "2024"
description = "Lists, prunes and stops docker containers, images and volumes, with a top-like dashboard"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
jiff = "0.2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
insta = "1"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
